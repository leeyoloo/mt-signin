name: MT论坛每日签到

on:
  schedule:
    # 每天北京时间 8:00 (UTC 0:00) 执行签到
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到
        env:
          MT_COOKIE: ${{ secrets.MT_COOKIE }}
        run: python signin.py
